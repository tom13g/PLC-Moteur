[project]
name = "tp-simu-auto"
version = "0.1.0"
description = "Simulation d'un automate (PLC) pilotant un moteur asynchrone, expose en Modbus TCP avec pymodbus"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymodbus>=3.15.0",
]

[build-system]
requires = ["uv_build>=0.12.14,<0.13"]
build-backend = "uv_build"
